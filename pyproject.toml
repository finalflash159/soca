[project]
name = "soca"
version = "0.1.0"
description = "On-device Vietnamese voice assistant"
authors = [{name = "Minh-Thinh Vo", email = "vo.m.thinh@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26,<3.0",
    "onnxruntime>=1.20",
    "transformers>=4.45",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "scipy>=1.13",
    "tqdm>=4.66",
    "rich>=13.7", # pretty terminal output for the metrics logger
    "click>=8.1", # CLI framework
    "huggingface-hub>=1.14.0",
    "llama-cpp-python>=0.3.0",
    "silero-vad>=6.2.1",
    "torchcodec>=0.12.0",
    "pyahocorasick>=2.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
    "ipython>=8.0",
    "jupyter>=1.0",
]
llm = [
    "llama-cpp-python>=0.3.0",  # for D2
]
eval = [
    "jiwer>=3.0",        # Word Error Rate
    "datasets>=3.0",     # HuggingFace datasets (Common Voice VI)
    "matplotlib>=3.9",
]
tts = [
    "eng-to-ipa>=0.0.2",
    "torchaudio>=2.0",
    "underthesea>=8.0.0",
    "viphoneme>=3.0.0",
    "vinorm>=2.0.0",
]

tts-piper = [
    "piper-tts>=1.4.2,<1.5",
]

tts-omnivoice = [
    "omnivoice>=0.1.5,<0.2",
]

tts-vieneu = [
    "vieneu>=2.4.0,<3",
]

tts-f5 = [
    "f5-tts>=1.1.20,<2",
]

[project.scripts]
soca = "soca.cli:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
force-exclude = true
extend-exclude = ["eval/prompts/*.jsonl"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line too long — let formatter handle

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
