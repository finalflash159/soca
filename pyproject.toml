[project]
name = "soca"
version = "0.1.0"
description = "On-device Vietnamese voice assistant"
authors = [{name = "Minh-Thinh Vo", email = "vo.m.thinh@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26,<3.0",
    "onnxruntime>=1.20",
    "transformers>=4.45",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "scipy>=1.13",
    "tqdm>=4.66",
    "rich>=13.7", # pretty terminal output for the metrics logger
    "click>=8.1", # CLI framework
    "huggingface-hub>=1.14.0",
    "llama-cpp-python>=0.3.0",
    "silero-vad>=6.2.1",
    "torchcodec>=0.12.0",
    "pywebrtc-audio>=0.1.0",
    "eng-to-ipa>=0.0.2",
    "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
    "pyright>=1.1.400",
    "ipython>=8.0",
    "jupyter>=1.0",
]
llm = [
    "llama-cpp-python>=0.3.0",  # for D2
]
llm-remote = [
    "openai>=1.0",   # OpenAI-compatible client for OpenAI/Groq/OpenRouter/Gemini
    "keyring>=25",   # secure API-key storage (P3)
    "tiktoken>=0.7", # optional pre-send token estimate
]
eval = [
    "jiwer>=3.0",        # Word Error Rate
    "datasets>=3.0",     # HuggingFace datasets (Common Voice VI)
    "matplotlib>=3.9",
    "pyahocorasick>=2.3.1",  # research-only BoH ablation
]
valtec-build = [
    "onnx>=1.17,<2.0",
    "torch>=2.0",
]
rag = [
    "bm25s>=0.3.10,<0.4",
    "sentencepiece>=0.2,<0.3",
    "sentence-transformers>=5.6,<6",
]
rag-eval-vietnamese = [
    "bm25s>=0.3.10,<0.4",
    "faiss-cpu>=1.14.3,<2",
    "fastembed>=0.7,<1",
    "model2vec>=0.7,<1",
    "pandas>=3,<4",
    "pyarrow>=24,<25",
    "sentencepiece>=0.2,<0.3",
    "sentence-transformers>=5.6,<6",
    "transformers>=5.14,<6",
    "underthesea>=9.5,<10",
    "usearch>=2.26,<3",
]

[project.scripts]
soca = "soca.cli:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
force-exclude = true
extend-exclude = ["eval/prompts/*.jsonl"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line too long — let formatter handle

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "experimental: research-only evaluation or ablation",
    "real_model: requires explicitly provisioned local model artifacts",
]
