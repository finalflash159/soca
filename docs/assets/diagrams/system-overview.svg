<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="980" viewBox="0 0 1580 980" role="img" aria-labelledby="title desc">
  <title id="title">System overview</title>
  <desc id="desc">SoCa voice flow from microphone through audio processing and assistant runtime to speech output. Context and tools are assembled from the knowledge index and memory stores. One LLM slot uses a local model by default or an explicitly selected remote provider.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L7 3.5L0 7z" fill="#263746"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L7 3.5L0 7z" fill="#635dff"/>
    </marker>
    <marker id="repair-arrow" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L7 3.5L0 7z" fill="#a16f2b"/>
    </marker>
    <style>
      rect{rx:0;ry:0}
      .bg{fill:#ffffff}
      .title{font:700 28px Arial,sans-serif;fill:#16202a}
      .caption{font:italic 14px Arial,sans-serif;fill:#4d5d6c}
      .label{font:700 17px Arial,sans-serif;fill:#16202a}
      .small{font:14px Arial,sans-serif;fill:#31404d}
      .data{fill:#d9efc7;stroke:#5d8348;stroke-width:2.2}
      .process{fill:#c9dde3;stroke:#486372;stroke-width:2.2}
      .runtime{fill:#e4ddff;stroke:#635dff;stroke-width:2.2}
      .neutral{fill:#e2e8ec;stroke:#16202a;stroke-width:2.2}
      .repair{fill:#efc36f;stroke:#a16f2b;stroke-width:2.2}
      .edge{stroke:#263746;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .runtime-edge{stroke:#635dff;stroke-width:1.8;fill:none;marker-end:url(#purple-arrow)}
      .repair-edge{stroke:#a16f2b;stroke-width:1.8;stroke-dasharray:7 6;fill:none;marker-end:url(#repair-arrow)}
      .icon{fill:none;stroke:#16202a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .icon-fill{fill:#16202a;stroke:none}
    </style>
  </defs>

  <rect class="bg" width="1580" height="980"/>
  <text class="title" x="48" y="48">System overview</text>
  <text class="caption" x="48" y="76">One assistant path: audio in, controlled runtime, context and tools, one LLM slot, then speech out.</text>

  <!-- User surface and audio path -->
  <path class="data" d="M60 190H210V264L192 280H60Z"/>
  <g class="icon" transform="translate(78 208) scale(.72)">
    <rect x="10" y="0" width="14" height="34" rx="7"/>
    <path d="M4 17v4a13 13 0 0 0 26 0v-4M17 34v8M9 42h16"/>
  </g>
  <text class="label" x="158" y="238" text-anchor="middle">Microphone</text>

  <path class="data" d="M250 190H410L392 280H232Z"/>
  <text class="label" x="321" y="238" text-anchor="middle">Audio turn</text>

  <rect class="process" x="455" y="190" width="180" height="74"/>
  <g class="icon" transform="translate(471 213) scale(.72)">
    <path d="M0 18h5l4-12 6 25 6-19 5 10h8"/>
  </g>
  <text class="label" x="560" y="238" text-anchor="middle">VAD + AEC</text>

  <rect class="process" x="670" y="190" width="180" height="74"/>
  <g class="icon" transform="translate(686 213) scale(.72)">
    <path d="M0 18h5l4-8 5 16 6-22 6 14 5-5h8"/>
  </g>
  <text class="label" x="775" y="238" text-anchor="middle">RobustASR</text>

  <rect class="runtime" x="885" y="190" width="220" height="74"/>
  <text class="label" x="995" y="238" text-anchor="middle">AssistantRuntime</text>

  <rect class="process" x="1145" y="190" width="170" height="74"/>
  <g class="icon" transform="translate(1162 214) scale(.68)">
    <path d="M0 12h8l7-8v24l-7-8H0zM25 8a10 10 0 0 1 0 16M31 3a17 17 0 0 1 0 26"/>
  </g>
  <text class="label" x="1240" y="238" text-anchor="middle">TTS</text>

  <path class="data" d="M1360 190H1510L1528 227L1510 264H1360Z"/>
  <g class="icon" transform="translate(1375 211) scale(.72)">
    <path d="M0 14h8l10-9v28l-10-9H0zM24 10a11 11 0 0 1 0 18M30 4a19 19 0 0 1 0 30"/>
  </g>
  <text class="label" x="1455" y="238" text-anchor="middle">Speaker</text>

  <!-- UI command surface -->
  <path class="runtime" d="M620 100H820V162H620L590 131Z"/>
  <g class="icon" transform="translate(620 117) scale(.62)">
    <path d="M0 3l10 8-10 8M15 20h15"/>
  </g>
  <text class="label" x="728" y="138" text-anchor="middle">CLI / Ink TUI</text>

  <!-- Runtime branches -->
  <rect class="repair" x="680" y="315" width="160" height="72"/>
  <text class="label" x="760" y="358" text-anchor="middle">Repair layer</text>

  <rect class="runtime" x="845" y="330" width="300" height="72"/>
  <g class="icon" transform="translate(1078 350) scale(.62)">
    <path d="M0 2h20v28H0zM6 10l5 5-5 5M14 20h-5"/>
  </g>
  <text class="label" x="970" y="372" text-anchor="middle">Context + tools</text>

  <rect class="neutral" x="1245" y="330" width="155" height="72"/>
  <g class="icon" transform="translate(1262 350) scale(.58)">
    <rect x="0" y="4" width="30" height="24" rx="3"/>
    <circle cx="9" cy="15" r="2"/><circle cx="21" cy="15" r="2"/>
    <path d="M15 0v4M15 28v4M-4 16h4M30 16h4"/>
  </g>
  <text class="label" x="1330" y="372" text-anchor="middle">LLM</text>
  <text class="small" x="1322" y="432" text-anchor="middle">Local · OpenAI · Gemini · OpenRouter · Groq</text>

  <!-- Persistent context sources -->
  <circle cx="995" cy="465" r="9" fill="#263746"/>
  <path class="process" d="M780 520C780 508 1000 508 1000 520V584C1000 596 780 596 780 584Z"/>
  <ellipse class="process" cx="890" cy="520" rx="110" ry="12"/>
  <text class="label" x="890" y="560" text-anchor="middle">Knowledge index</text>

  <path class="process" d="M1020 520C1020 508 1240 508 1240 520V584C1240 596 1020 596 1020 584Z"/>
  <ellipse class="process" cx="1130" cy="520" rx="110" ry="12"/>
  <text class="label" x="1130" y="560" text-anchor="middle">Memory stores</text>

  <!-- Directional connectors; source merge is explicit and does not cross nodes. -->
  <path class="edge" d="M210 227H232"/>
  <path class="edge" d="M410 227H455"/>
  <path class="edge" d="M635 227H670"/>
  <path class="edge" d="M850 227H885"/>
  <path class="edge" d="M1105 227H1145"/>
  <path class="edge" d="M1315 227H1360"/>
  <path class="runtime-edge" d="M720 162L995 190"/>
  <path class="repair-edge" d="M760 264V315"/>
  <path class="runtime-edge" d="M995 264V330"/>
  <path class="edge" d="M1060 264V300H1322V330"/>
  <path class="edge" d="M890 520V465H995"/>
  <path class="edge" d="M1130 520V465H995"/>
  <path class="runtime-edge" d="M995 465V402"/>

  <text class="small" x="790" y="700" text-anchor="middle">Knowledge and memory are assembled into one context before the selected LLM call.</text>
</svg>
