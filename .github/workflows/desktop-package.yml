name: desktop-package

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-package.yml"
      - ".github/workflows/desktop-release.yml"
      - "desktop/**"
      - "scripts/build_desktop_sidecar.py"
      - "scripts/download_smart_turn.py"
      - "scripts/verify_desktop_sidecar.py"
      - "scripts/write_tauri_release_config.py"
      - "soca/**"
      - "tests/test_desktop_sidecar_build.py"
      - "tests/test_engine_packaged_storage_flow.py"
      - "tests/test_tauri_release_config.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    name: ${{ matrix.name }} package proof
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            bundles: app,dmg
          - name: Windows x64
            runner: windows-2022
            bundles: msi,nsis
          - name: Linux x64
            runner: ubuntu-22.04
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux bundle prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libportaudio2 portaudio19-dev patchelf
      - name: Evict incompatible Linux llama runtime cache
        if: runner.os == 'Linux'
        run: uv cache clean llama-cpp-python
      - name: Install frozen-runtime and desktop dependencies
        env:
          UV_NO_BINARY_PACKAGE: ${{ runner.os == 'Linux' && 'llama-cpp-python' || '' }}
        run: |
          uv sync --locked --extra dev --extra desktop-build --extra llm-remote
          npm ci --prefix desktop
      - name: Provision pinned Smart Turn endpointing model
        run: uv run python scripts/download_smart_turn.py
      - name: Run desktop packaging contracts
        run: >
          uv run pytest -q
          tests/test_desktop_sidecar_build.py
          tests/test_engine_packaged_storage_flow.py
          tests/test_tauri_release_config.py
      - name: Run desktop unit suite
        run: npm test --prefix desktop
      - name: Install linuxdeploy with host-driver exclusion support
        if: runner.os == 'Linux'
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/soca-cache
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x86_64" ;;
            aarch64|arm64) arch="aarch64" ;;
            *) echo "Unsupported linuxdeploy architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          tools_dir="$XDG_CACHE_HOME/tauri"
          mkdir -p "$tools_dir"
          curl --fail --location --retry 3 --show-error \
            --output "$tools_dir/linuxdeploy-${arch}.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${arch}.AppImage"
          chmod +x "$tools_dir/linuxdeploy-${arch}.AppImage"
          "$tools_dir/linuxdeploy-${arch}.AppImage" --appimage-extract-and-run --version
      - name: Build native installer with its bundled Python runtime
        env:
          # `linuxdeploy` is itself an AppImage.  Explicit extraction keeps
          # packaging independent of the runner's FUSE setup.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # The GTK plugin cannot reliably infer the version from a Tauri
          # binary in headless CI. The desktop runtime is built on GTK 3.
          DEPLOY_GTK_VERSION: "3"
          # linuxdeploy runs ldd over the bundled Python extensions. Torchaudio
          # resolves CUDA from its own copied runtime and the sidecar root, then
          # resolves Torch from Torch's native library directory. Keep the full
          # explicit closure visible while linuxdeploy scans the frozen runtime.
          LD_LIBRARY_PATH: ${{ runner.os == 'Linux' && format('{0}/desktop/src-tauri/resources/soca-engine/_internal/torchaudio/lib:{0}/desktop/src-tauri/resources/soca-engine/_internal:{0}/desktop/src-tauri/resources/soca-engine/_internal/torch/lib', github.workspace) || '' }}
          # The NVIDIA driver belongs to the host. The bundled CUDA runtime is
          # self-contained, but linuxdeploy must not attempt to deploy libcuda.
          LINUXDEPLOY_EXCLUDED_LIBRARIES: ${{ runner.os == 'Linux' && 'libcuda.so*' || '' }}
          XDG_CACHE_HOME: ${{ runner.temp }}/soca-cache
        run: npm run tauri:build --prefix desktop -- --verbose --bundles ${{ matrix.bundles }}
      - name: Prove frozen sidecar migration and persistence outside the checkout
        shell: bash
        run: |
          sidecar_path=$(find desktop/src-tauri/resources/soca-engine -type f -name 'soca-engine*' ! -name '*.tmp' -print -quit)
          test -n "$sidecar_path"
          if [ "$RUNNER_OS" = "macOS" ]; then
            bundled_sidecar=desktop/src-tauri/target/release/bundle/macos/SoCa.app/Contents/Resources/resources/soca-engine/soca-engine
            test -f "$bundled_sidecar"
            test "$(shasum -a 256 "$sidecar_path" | awk '{print $1}')" = "$(shasum -a 256 "$bundled_sidecar" | awk '{print $1}')"
            sidecar_path="$bundled_sidecar"
          fi
          uv run python scripts/verify_desktop_sidecar.py --sidecar "$sidecar_path"
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soca-${{ runner.os }}-${{ runner.arch }}
          path: desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
