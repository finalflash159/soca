name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-signed-release:
    name: ${{ matrix.name }} signed release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            platform: darwin
          - name: Windows x64
            runner: windows-2022
            platform: win32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release secrets are present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_UPDATER_PUBKEY"
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            test -n "$APPLE_CERTIFICATE"
            test -n "$APPLE_CERTIFICATE_PASSWORD"
            test -n "$APPLE_SIGNING_IDENTITY"
            test -n "$APPLE_ID"
            test -n "$APPLE_PASSWORD"
            test -n "$APPLE_TEAM_ID"
          else
            test -n "$WINDOWS_CERTIFICATE"
            test -n "$WINDOWS_CERTIFICATE_PASSWORD"
            test -n "$WINDOWS_CERTIFICATE_THUMBPRINT"
            test -n "$WINDOWS_TIMESTAMP_URL"
          fi
      - name: Import Windows signing certificate
        if: matrix.platform == 'win32'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'soca-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force) | Out-Null
          Remove-Item $certificatePath
      - name: Install build dependencies
        run: |
          uv sync --locked --extra desktop-build --extra llm-remote
          npm ci --prefix desktop
      - name: Provision pinned Smart Turn endpointing model
        run: uv run python scripts/download_smart_turn.py
      - name: Write release-only updater and signing configuration
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: uv run python scripts/write_tauri_release_config.py --output desktop/.tauri.release.json --platform ${{ matrix.platform }}
      - name: Prove frozen sidecar before publishing it
        shell: bash
        run: |
          npm run package:sidecar --prefix desktop
          sidecar_path=$(find desktop/src-tauri/resources/soca-engine -type f -name 'soca-engine*' ! -name '*.tmp' -print -quit)
          test -n "$sidecar_path"
          uv run python scripts/verify_desktop_sidecar.py --sidecar "$sidecar_path"
      - name: Build signed installers and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          args: --config .tauri.release.json --features release-updater
          tagName: app-v__VERSION__
          releaseName: SoCa v__VERSION__
          releaseBody: See RELEASE_NOTES.md in the source release for privacy, retention, install, and rollback information.
          releaseDraft: true
          prerelease: false
      - name: Verify signed macOS microphone entitlement
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          app=desktop/src-tauri/target/release/bundle/macos/SoCa.app
          test -f "$app/Contents/MacOS/soca-desktop"
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$app/Contents/MacOS/soca-desktop" 2>/dev/null \
            | plutil -extract com.apple.security.device.audio-input raw - \
            | grep -qx true
