[package]
name = "soca-edge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "SoCa ARM edge capture, endpointing, and NDJSON bridge"

[features]
default = ["onnx"]
onnx = ["dep:ndarray", "dep:ort", "dep:rustfft"]

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
clap = { version = "4.5.45", features = ["derive"] }
cpal = "=0.18.1"
ndarray = { version = "0.17.1", optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["api-24", "load-dynamic", "ndarray", "std"], optional = true }
rtrb = "=0.3.4"
rustfft = { version = "6.4.0", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"

[dev-dependencies]
approx = "0.5.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
