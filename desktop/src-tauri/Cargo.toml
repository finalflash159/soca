[package]
name = "soca-desktop"
version = "0.1.0"
description = "SoCa desktop shell over the soca engine"
authors = ["Võ Minh Thịnh"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "soca_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# The updater needs a real signing public key and endpoint. Only the release
# workflow supplies both, so package proofs must not register it with null config.
release-updater = []

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2.3.1"
# Kept linked in every build so Tauri can generate and validate the updater
# capability. Runtime registration remains behind `release-updater` above.
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
